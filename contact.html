            <main>
                <section>
                    <h1 class="header">CONTACT</h1>

                    <form class="contact-form" onsubmit="sendMessage(event)">
                        <input name="name" type="text" placeholder="Name" required>
                        <input name="email" type="email" placeholder="Email" required><br>
                        <textarea name="message" rows="10" cols="40" placeholder="Message" required></textarea><br>
                        <input type="submit" value="Send">
                    </form>   
                </section>
            </main>

            <footer class="footer">
                <div class="logo"><span class="name">ETHAN PERVERE</span><br><span class="design">DESIGN</span></div>
                <a class="email" href="mailto:ethan.pervere@gmail.com?subject=From%20your%20portfolio">ETHAN.PERVERE@GMAIL.COM</a>
            </footer>

            <script>
                async function sendMessage(event) {
                    event.preventDefault();

                    const form = event.target;
                    const formData = new FormData(form);
                    
                    const data = {};
                    formData.forEach((value, key) => {
                        data[key] = value;
                    });

                    try {
                        const response = await fetch("https://mail.ethanpervere.com/proxy-message", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                name: form.elements.name.value,
                                email: form.elements.email.value,
                                message: form.elements.message.value
                            })
                        });

                        if (!response.ok) {
                            const err = await response.json();
                            alert("Error: " + (err.error || "Unknown error"));
                            return;
                        }

                        alert("Message sent successfully!");
                        form.reset();
                    } catch (error) {
                        alert("Failed to send message. Check console for details.");
                        console.error(error);
                    }

                    form.reset();
                }
            </script>
