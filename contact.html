<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Ethan Pervere Design Contact Page">
            <title>Ethan Pervere Design | Contact</title>
            <link rel="stylesheet" href="css/Styles.css">
            <link rel="canonical">
        </head>
        <body>
            <header>
                <div class="name"><h1><a href="index.html">ETHAN PERVERE<br> <span class="design">DESIGN</span></a></h1></div>
                <nav class="navigation">
                    <a class="nav-link" href="scenic-design.html">SCENIC DESIGN</a>
                    <a class="nav-link" href="sound-design.html">SOUND DESIGN</a>
                    <a class="nav-link" href="about.html">ABOUT</a>
                    <a class="nav-link" href="contact.html">CONTACT</a>
                </nav>
            </header>
            
            <main>
                <section>
                    <h1 class="header">CONTACT</h1>

                    <form class="contact-form" onsubmit="sendMessage(event)">
                        <input name="name" type="text" placeholder="Name" required>
                        <input name="email" type="email" placeholder="Email" required><br>
                        <textarea name="message" rows="10" cols="40" placeholder="Message" required></textarea><br>
                        <input type="submit" value="Send">
                    </form>   
                </section>
            </main>

            <footer class="name footer"><h2>ETHAN PERVERE</h2>
                <p><span class="design">DESIGN</span></p>
                <a href="mailto:ethan.pervere@gmail.com?subject=From%20your%20portfolio"><span class="email">ETHAN.PERVERE@GMAIL.COM<span></a>
            </footer>

            <script>
                async function sendMessage(event) {
                    event.preventDefault();

                    const form = event.target;
                    const formData = new FormData(form);
                    
                    const data = {};
                    formData.forEach((value, key) => {
                        data[key] = value;
                    });

                    try {
                        const response = await fetch("https://mail.ethanpervere.com/proxy-message", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                name: form.elements.name.value,
                                email: form.elements.email.value,
                                message: form.elements.message.value
                            })
                        });

                        if (!response.ok) {
                            const err = await response.json();
                            alert("Error: " + (err.error || "Unknown error"));
                            return;
                        }

                        alert("Message sent successfully!");
                        form.reset();
                    } catch (error) {
                        alert("Failed to send message. Check console for details.");
                        console.error(error);
                    }

                    form.reset();
                }
            </script>
        </body>
    </html>
