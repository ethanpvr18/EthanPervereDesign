            <script>
                const detail = document.querySelector("#detail");
                const detailImage = document.querySelector("#detail-image");
                const closeButton = document.querySelector(".detail-close");
                const previousButton = document.querySelector(".detail-prev");
                const nextButton = document.querySelector(".detail-next");

                const detailGroups = document.querySelectorAll(".parent, .slideshow");

                let detailImages = [];
                let detailIndex = 0;

                function getImageSource(image) {
                    return (
                        image.getAttribute("data-full") ||
                        image.currentSrc ||
                        image.getAttribute("data-src") ||
                        image.getAttribute("src")
                    );
                }

                function showDetailImage(index) {
                    if (!detailImages.length) {
                        return;
                    }

                    if (index < 0) {
                        index = detailImages.length - 1;
                    }

                    if (index >= detailImages.length) {
                        index = 0;
                    }

                    detailIndex = index;

                    const selectedImage = detailImages[detailIndex];

                    detailImage.src = getImageSource(selectedImage);
                    detailImage.alt = selectedImage.alt || "";
                }

                detailGroups.forEach(function (group) {
                    group.addEventListener("click", function (event) {
                        const selectedImage = event.target.closest("img");

                        if (!selectedImage || !group.contains(selectedImage)) {
                            return;
                        }

                        detailImages = Array.from(group.querySelectorAll("img"));
                        detailIndex = detailImages.indexOf(selectedImage);

                        showDetailImage(detailIndex);
                        detail.showModal();
                    });
                });

                previousButton.addEventListener("click", function () {
                    showDetailImage(detailIndex - 1);
                });

                nextButton.addEventListener("click", function () {
                    showDetailImage(detailIndex + 1);
                });

                closeButton.addEventListener("click", function () {
                    detail.close();
                });

                detail.addEventListener("click", function (event) {
                    if (event.target === detail) {
                        detail.close();
                    }
                });

                document.addEventListener("keydown", function (event) {
                    if (!detail.open) {
                        return;
                    }

                    if (event.key === "ArrowLeft") {
                        showDetailImage(detailIndex - 1);
                    }

                    if (event.key === "ArrowRight") {
                        showDetailImage(detailIndex + 1);
                    }
                });
            </script>
